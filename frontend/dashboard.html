<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:20px;
        }

        .card{
            background:white;
            padding:25px;
            margin-top:25px;
            border-radius:15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input{
            padding:10px;
            margin-top:10px;
            width:200px;
        }

        button{
            padding:10px 20px;
            background: #0d6efd;;
            color:white;
            border:none;
            margin-top:10px;
            cursor:pointer;
        }

        li{
            margin-top:10px;
        }

    </style>

</head>

<body class="bg-light">

<div class="container mt-5">

<nav class="navbar navbar-dark bg-dark rounded p-3">

<h3 class="text-white">Team Task Manager</h3>

<button onclick="logout()" class="btn btn-danger">
Logout
</button>

</nav>
</nav>

<div class="row mt-4">

<div class="col-md-4">

<div class="card text-center">

<h3 id="projectCount">0</h3>

<p>Projects</p>

</div>

</div>

<div class="col-md-4">

<div class="card text-center">

<h3 id="taskCount">0</h3>

<p>Tasks</p>

</div>

</div>

<div class="col-md-4">

<div class="card text-center">

<h3 id="pendingCount">0</h3>

<p>Pending Tasks</p>

</div>

</div>

</div>


<!-- CREATE PROJECT -->

<div class="card">

<h2>Create Project</h2>

<input type="text" id="projectName" placeholder="Project Name">

<input type="text" id="projectDescription" placeholder="Description">

<br>

<button onclick="createProject()">Create Project</button>

</div>

<!-- PROJECT LIST -->

<div class="card">

<h2>Projects</h2>

<ul id="projectList"></ul>

</div>

<!-- CREATE TASK -->

<div class="card">

<h2>Create Task</h2>

<input type="text" id="taskTitle" placeholder="Task Title">

<input type="text" id="taskDescription" placeholder="Description">

<input type="text" id="taskStatus" placeholder="Status">

<input type="date" id="taskDueDate">

<input type="number" id="taskUserId" placeholder="Assign User ID">

<input type="number" id="taskProjectId" placeholder="Project ID">

<br>

<button onclick="createTask()">Create Task</button>

</div>

<!-- TASK LIST -->

<div class="card">

<h2>Tasks</h2>

<ul id="taskList"></ul>

</div>

<script>

const token = localStorage.getItem('token')


// LOAD PROJECTS

async function loadProjects(){

    const response = await fetch('http://127.0.0.1:5000/projects',{

        method:'GET',

        headers:{
            'Authorization':'Bearer ' + token
        }

    })

    const projects = await response.json()
    document.getElementById('projectCount').innerText = projects.length

    let output=''

    projects.forEach(project=>{

        output += `

        <li>

        <b>${project.name}</b>
        - ${project.description}

        </li>

        `
    })

    document.getElementById('projectList').innerHTML = output
}



// CREATE PROJECT

async function createProject(){

    const response = await fetch('http://127.0.0.1:5000/projects',{

        method:'POST',

        headers:{
            'Content-Type':'application/json',
            'Authorization':'Bearer ' + token
        },

        body:JSON.stringify({

            name:document.getElementById('projectName').value,
            description:document.getElementById('projectDescription').value

        })

    })

    const data = await response.json()

    alert(data.message)

    loadProjects()
}



// LOAD TASKS

async function loadTasks(){

    const response = await fetch('http://127.0.0.1:5000/tasks',{

        method:'GET',

        headers:{
            'Authorization':'Bearer ' + token
        }

    })

    const tasks = await response.json()
    document.getElementById('taskCount').innerText = tasks.length

    const pending = tasks.filter(task => task.status !== 'Completed')

    document.getElementById('pendingCount').innerText = pending.length

    let output=''

    tasks.forEach(task=>{

        output += `

        <li>

        <b>${task.title}</b>
        -
        ${task.description}
        -
        ${task.status}
        -
        ${task.project}
        <select onchange="updateTaskStatus(${task.id}, this.value)">

        <option value="Pending"
        ${task.status === 'Pending' ? 'selected' : ''}>
        Pending
        </option>

        <option value="In Progress"
        ${task.status === 'In Progress' ? 'selected' : ''}>
        In Progress
        </option>

        <option value="Completed"
        ${task.status === 'Completed' ? 'selected' : ''}>
        Completed
        </option>

        </select>
        </li>
 
    `
    })

    document.getElementById('taskList').innerHTML = output
}
async function updateTaskStatus(taskId, status){

    const response = await fetch(`http://127.0.0.1:5000/tasks/${taskId}`,{

        method:'PUT',

        headers:{
            'Content-Type':'application/json',
            'Authorization':'Bearer ' + token
        },

        body:JSON.stringify({

            status:status

        })

    })

    const data = await response.json()

    alert(data.message)

    loadTasks()
}


// CREATE TASK

async function createTask(){

    const response = await fetch('http://127.0.0.1:5000/tasks',{

        method:'POST',

        headers:{
            'Content-Type':'application/json',
            'Authorization':'Bearer ' + token
        },

        body:JSON.stringify({

            title:document.getElementById('taskTitle').value,
            description:document.getElementById('taskDescription').value,
            status:document.getElementById('taskStatus').value,
            due_date:document.getElementById('taskDueDate').value,
            user_id:document.getElementById('taskUserId').value,
            project_id:document.getElementById('taskProjectId').value

        })

    })

    const data = await response.json()

    alert(data.message)

    loadTasks()
}
function logout(){

    localStorage.removeItem('token')

    window.location.href='login.html'
}



// INITIAL LOAD

loadProjects()

loadTasks()

</script>
</div>
</body>

</html>
